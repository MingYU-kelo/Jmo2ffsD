<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Flux HvH 月度统计</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    @font-face {
      font-family: "ZH CN";
      src: url("zh-cn.ttf") format("truetype");
    }
    body { font-family: "ZH CN", "Courier New", Courier, monospace; }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    .stats-table th,
    .stats-table td {
      text-align: left;
      padding: 4px 8px;
    }
    .stats-table th {
      opacity: 0.6;
      font-weight: inherit;
    }
    .stats-table tbody tr {
      cursor: pointer;
    }
    .stats-table tbody tr:hover,
    .stats-table tbody tr.active {
      font-weight: 900;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    .detail-table th,
    .detail-table td {
      text-align: left;
      padding: 3px 8px;
    }
    .detail-table th {
      opacity: 0.6;
      font-weight: inherit;
      font-size: 14px;
    }
    .detail-table tbody tr.hidden {
      display: none;
    }
    .loading {
      opacity: 0.5;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 14px;
      opacity: 0.6;
    }
    .back-link:hover {
      opacity: 1;
    }
    .error-msg {
      color: var(--warning);
      margin-top: 10px;
    }
    .summary-bar {
      display: flex;
      gap: 28px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
    }
    .summary-label {
      font-size: 13px;
      opacity: 0.6;
    }
    .summary-value {
      font-weight: 900;
    }
    .progress-bar {
      width: 100%;
      height: 2px;
      background: #333;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--text);
      transition: width 0.2s;
    }
    .uid {
      opacity: 0.5;
      font-size: 13px;
      margin-left: 4px;
    }
    .cache-badge {
      font-size: 11px;
      opacity: 0.5;
      margin-left: 6px;
    }
    .type-toggle {
      display: inline-flex;
      margin-bottom: 14px;
    }
    .type-toggle button {
      background: none;
      border: 1px solid #555;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 2px 12px;
      cursor: pointer;
    }
    .type-toggle button:first-child {
      border-right: none;
    }
    .type-toggle button.active {
      background: var(--text);
      color: var(--background);
      font-weight: 900;
    }
    .search-wrap {
      margin-bottom: 10px;
    }
    .search-input {
      width: 100%;
      max-width: 320px;
      background: transparent;
      border: 1px solid #555;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 4px 10px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--text);
    }
    .search-input::placeholder {
      color: #666;
    }
    .no-results {
      opacity: 0.6;
      margin-top: 10px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
    }
    .pager button {
      background: none;
      border: 1px solid #555;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 2px 10px;
      cursor: pointer;
    }
    .pager button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .pager button:hover:not(:disabled) {
      background: var(--text);
      color: var(--background);
    }
    .pager span {
      opacity: 0.6;
    }
    .pager input {
      width: 40px;
      background: transparent;
      border: 1px solid #555;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 2px 4px;
      text-align: center;
      outline: none;
    }
    .pager input:focus {
      border-color: var(--text);
    }
    .highlight-row {
      background: #2a2a00;
      outline: 1px solid #ff0;
    }
  </style>
</head>
<body>
<main>
  <a class="brand hover-bold" href="./">Flux HvH&#xA0;&#x6708;&#x5EA6;&#x7EDF;&#x8BA1;</a>
  <p class="byline">
    Flux&#x6392;&#x884C;&#x699C; &#xB7; &#x542B;&#x4E2A;&#x4EBA;&#x699C;&#x3001;&#x516C;&#x4F1A;&#x699C;[&#x699C;&#x5355;&#x6309;&#x81EA;&#x7136;&#x6708;&#x7EDF;&#x8BA1;]<span class="cache-badge" id="cache-badge"></span>
  </p>
  <p class="byline">&#x516C;&#x4F1A;&#x8BE6;&#x60C5;&#x6570;&#x636E;&#x57FA;&#x4E8E;2025&#x5E74;1&#x6708;&#x81F3;&#x4ECA;&#x7684;Flux&#x6392;&#x884C;&#x699C;&#x8BB0;&#x5F55;&#x7EDF;&#x8BA1;&#xFF0C;&#x975E;&#x5168;&#x91CF;&#x5B9E;&#x65F6;&#x6570;&#x636E;&#xFF0C;&#x53EF;&#x80FD;&#x5B58;&#x5728;&#x9057;&#x6F0F;&#xFF0C;&#x663E;&#x793A;&#x7ED3;&#x679C;&#x4EC5;&#x4F9B;&#x53C2;&#x8003;&#x3002;&#x516C;&#x4F1A;&#x5185;&#x6210;&#x5458;&#x5206;&#x6570;&#x4EE5;&#x53CA;KD&#x7B49;&#x4E5F;&#x662F;&#x6309;&#x81EA;&#x7136;&#x6708;&#x7EDF;&#x8BA1;&#x7684;&#x3002;</p>

  <section id="overview-section">
    <h2>&#x6708;&#x5EA6;&#x6982;&#x89C8;</h2>
    <div class="type-toggle" id="overview-toggle">
      <button data-type="user" class="active">&#x4E2A;&#x4EBA;</button
      ><button data-type="guild">&#x516C;&#x4F1A;</button>
    </div>
    <p class="byline" id="overview-desc">&#x52A0;&#x8F7D;&#x4E2D;...</p>
    <div id="month-table-container"></div>
    <p class="byline error-msg" id="error-msg" style="display:none"></p>
  </section>

  <section id="detail-section" style="display:none">
    <a class="back-link hover-bold" href="#" id="back-btn">&#x2190; &#x8FD4;&#x56DE;&#x6982;&#x89C8;</a>
    <h2 id="detail-title"></h2>
    <div class="summary-bar" id="summary-bar"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <input class="search-input" id="search-input" type="text" placeholder="&#x641C;&#x7D22; UID / &#x73A9;&#x5BB6;&#x540D; / &#x516C;&#x4F1A;&#x540D;..." />
      </div>
      <p class="byline" id="detail-desc">&#x52A0;&#x8F7D;&#x4E2D;...</p>
    </div>
    <div id="detail-table-container"></div>
  </section>

  <section id="guild-section" style="display:none">
    <a class="back-link hover-bold" href="#" id="guild-back-btn">&#x2190; &#x8FD4;&#x56DE;&#x4E0A;&#x4E00;&#x9875;</a>
    <h2 id="guild-title"></h2>
    <div class="summary-bar" id="guild-summary"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <input class="search-input" id="guild-search-input" type="text" placeholder="&#x641C;&#x7D22; UID / &#x7528;&#x6237;&#x540D;..." />
      </div>
      <p class="byline" id="guild-desc"></p>
    </div>
    <div id="guild-table-container"></div>
  </section>
</main>

<script>
const DATA_OVERVIEW = '/data/overview.json';
const DATA_MONTH = '/data/';
const DATA_GUILD_MONTH = '/data/guild-';
const DATA_GUILD_MEMBERS = '/data/guild-members-';

const PAGE_ROWS = 20;

let currentType = 'user';
let allDates = { user: [], guild: [] };
let monthGroups = { user: {}, guild: {} };
let cachedOverview = null;
let currentDetailData = null;
let detailPage = 1;
let overviewPage = 1;
let guildPage = 1;
let currentGuildData = null;

function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }

function fmtMonth(ym) {
  const [y, m] = ym.split('-');
  return `${y} 年 ${parseInt(m)} 月`;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function groupByMonth(dates) {
  const groups = {};
  for (const d of dates) {
    const ym = d.substring(0, 7);
    if (!groups[ym]) groups[ym] = [];
    groups[ym].push(d);
  }
  return groups;
}

function renderMonthTable() {
  const groups = monthGroups[currentType];
  const months = Object.keys(groups).sort().reverse();
  const label = currentType === 'user' ? '玩家' : '公会';
  const cacheKey = currentType === 'user' ? 'months' : 'guildMonths';

  const totalPages = Math.ceil(months.length / PAGE_ROWS);
  if (overviewPage > totalPages) overviewPage = totalPages || 1;

  const start = (overviewPage - 1) * PAGE_ROWS;
  const pageMonths = months.slice(start, start + PAGE_ROWS);

  let html = '<table class="stats-table"><thead><tr><th>月份</th><th>数据天数</th><th>' + label + '排名条目</th></tr></thead><tbody>';

  for (const ym of pageMonths) {
    const dayCount = groups[ym].length;
    let entryText = '-';
    let entryTitle = '';
    const entryCountEl = '<td class="entry-count" data-month="' + ym + '">-</td>';

    if (cachedOverview && cachedOverview[cacheKey] && cachedOverview[cacheKey][ym]) {
      const m = cachedOverview[cacheKey][ym];
      entryText = m.totalEntries.toLocaleString();
      entryTitle = '去重' + label + ': ' + m.userCount;
    }

    html += '<tr data-month="' + ym + '">'
      + '<td>' + fmtMonth(ym) + '</td>'
      + '<td>' + dayCount + '</td>'
      + '<td class="entry-count" data-month="' + ym + '" title="' + escAttr(entryTitle) + '">' + entryText + '</td>'
      + '</tr>';
  }

  html += '</tbody></table>';

  if (totalPages > 1) {
    html += '<div class="pager">'
      + '<button id="overview-prev"' + (overviewPage <= 1 ? ' disabled' : '') + '>上一页</button>'
      + '<span>第</span><input id="overview-page-input" type="text" value="' + overviewPage + '"><span>/ ' + totalPages + ' 页</span>'
      + '<button id="overview-next"' + (overviewPage >= totalPages ? ' disabled' : '') + '>下一页</button>'
      + '</div>';
  }

  $('#month-table-container').innerHTML = html;

  for (const tr of $$('.stats-table tbody tr')) {
    tr.addEventListener('click', () => { showMonthDetail(tr.dataset.month); });
  }

  const prevBtn = $('#overview-prev');
  const nextBtn = $('#overview-next');
  const pageInput = $('#overview-page-input');
  if (prevBtn) prevBtn.addEventListener('click', () => { overviewPage--; renderMonthTable(); });
  if (nextBtn) nextBtn.addEventListener('click', () => { overviewPage++; renderMonthTable(); });
  if (pageInput) {
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const n = parseInt(pageInput.value);
        if (n >= 1 && n <= totalPages) { overviewPage = n; renderMonthTable(); }
      }
    });
  }
}

function updateOverviewToggle() {
  for (const btn of $$('#overview-toggle button')) {
    btn.classList.toggle('active', btn.dataset.type === currentType);
  }
}

async function loadOverview() {
  try {
    cachedOverview = await fetchJSON(DATA_OVERVIEW);
    allDates.user = cachedOverview.dates || [];
    allDates.guild = cachedOverview.guildDates || [];
    monthGroups.user = groupByMonth(allDates.user);
    monthGroups.guild = groupByMonth(allDates.guild);
  } catch (e) {
    console.error('Failed to load overview:', e);
    cachedOverview = null;
    allDates.user = [];
    allDates.guild = [];
    monthGroups.user = {};
    monthGroups.guild = {};
  }

  if (cachedOverview && cachedOverview.lastSync) {
    const syncDate = new Date(cachedOverview.lastSync);
    const guildMonths = cachedOverview.guildMonths ? Object.keys(cachedOverview.guildMonths).length : 0;
    $('#cache-badge').textContent =
      '(已缓存 · 玩家' + Object.keys(cachedOverview.months || {}).length + '月 · 公会' + guildMonths + '月)';
  } else {
    $('#cache-badge').textContent = '(无数据)';
  }

  const groups = monthGroups[currentType];
  const dates = currentType === 'user' ? allDates.user : allDates.guild;
  $('#overview-desc').textContent = '共 ' + Object.keys(groups).length + ' 个月，' + dates.length + ' 天数据';

  renderMonthTable();
}

$('#overview-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  currentType = btn.dataset.type;
  overviewPage = 1;
  updateOverviewToggle();
  const groups = monthGroups[currentType];
  const dates = currentType === 'user' ? allDates.user : allDates.guild;
  $('#overview-desc').textContent = '共 ' + Object.keys(groups).length + ' 个月，' + dates.length + ' 天数据';
  renderMonthTable();
});

function renderDetail(ym, data) {
  const users = data.users;
  const isGuild = currentType === 'guild';
  const idField = isGuild ? 'guildId' : 'id';
  const nameField = isGuild ? 'guildName' : 'userName';
  const idLabel = isGuild ? 'GID' : 'UID';

  currentDetailData = { ym, data, users };

  $('#detail-desc').style.display = 'none';

  $('#summary-bar').innerHTML =
    '<div class="summary-item">'
    + '<span class="summary-label">数据天数</span>'
    + '<span class="summary-value">' + data.dates.length + '</span>'
    + '</div>'
    + '<div class="summary-item">'
    + '<span class="summary-label">上榜人次</span>'
    + '<span class="summary-value">' + data.totalEntries.toLocaleString() + '</span>'
    + '</div>'
    + '<div class="summary-item">'
    + '<span class="summary-label">去重' + (isGuild ? '公会' : '玩家') + '</span>'
    + '<span class="summary-value">' + users.length + '</span>'
    + '</div>'
    + '<div class="summary-item">'
    + '<span class="summary-label">同步时间</span>'
    + '<span class="summary-value" style="font-size:13px">' + (data.syncedAt ? new Date(data.syncedAt).toLocaleString() : '-') + '</span>'
    + '</div>';

  if (users.length === 0) {
    $('#detail-table-container').innerHTML = '<p>暂无数据</p>';
    $('#search-input').style.display = 'none';
    return;
  }

  $('#search-input').style.display = 'block';
  $('#search-input').value = '';
  renderTable(users, idField, nameField, idLabel);
}

function renderTable(users, idField, nameField, idLabel) {
  currentDetailData.allUsers = users;
  currentDetailData.idField = idField;
  currentDetailData.nameField = nameField;
  currentDetailData.idLabel = idLabel;
  detailPage = 1;
  renderDetailPage();
}

function getFilteredUsers() {
  if (!currentDetailData || !currentDetailData.allUsers) return [];
  const q = ($('#search-input').value || '').toLowerCase().trim();
  const users = currentDetailData.allUsers;
  const nameField = currentDetailData.nameField;
  const idField = currentDetailData.idField;
  if (!q) return users;
  return users.filter(u => {
    const name = (u[nameField] || '').toLowerCase();
    const id = String(u[idField] || '').toLowerCase();
    return name.includes(q) || id.includes(q);
  });
}

function renderDetailPage() {
  if (!currentDetailData || !currentDetailData.allUsers) return;

  const { idField, nameField, idLabel } = currentDetailData;
  const filtered = getFilteredUsers();
  const totalPages = Math.ceil(filtered.length / PAGE_ROWS);
  if (detailPage > totalPages) detailPage = totalPages || 1;
  const start = (detailPage - 1) * PAGE_ROWS;
  const pageUsers = filtered.slice(start, start + PAGE_ROWS);

  let html = '<table class="detail-table" id="detail-table"><thead><tr>'
    + '<th>#</th><th>' + (currentType === 'guild' ? '公会' : '玩家') + '</th><th>出现天数</th><th>月总积分</th><th>K/D</th>'
    + '</tr></thead><tbody>';

  if (pageUsers.length === 0) {
    html += '<tr><td colspan="5" style="text-align:center;opacity:0.5">无匹配结果</td></tr>';
  } else {
    for (let i = 0; i < pageUsers.length; i++) {
      const u = pageUsers[i];
      const kd = u.totalDeath > 0 ? (u.totalKill / u.totalDeath).toFixed(2) : '0.00';
      const idVal = u[idField] || '';
      let nameCell = esc(u[nameField] || '');
      nameCell += '<span class="uid">' + idLabel + ':' + idVal + '</span>';
      const dataAttr = currentType === 'guild'
        ? ' data-guild-id="' + idVal + '" data-guild-name="' + escAttr(u[nameField] || '') + '"'
        : ' data-uid="' + idVal + '" data-uname="' + escAttr(u[nameField] || '') + '"';
      html += '<tr' + dataAttr + '>'
        + '<td>' + (start + i + 1) + '</td>'
        + '<td>' + nameCell + '</td>'
        + '<td>' + u.appearances + '</td>'
        + '<td>' + u.totalScore.toLocaleString() + '</td>'
        + '<td>' + kd + '</td>'
        + '</tr>';
    }
  }

  html += '</tbody></table>';

  if (totalPages > 1) {
    html += '<div class="pager">'
      + '<button id="detail-prev"' + (detailPage <= 1 ? ' disabled' : '') + '>上一页</button>'
      + '<span>第</span><input id="detail-page-input" type="text" value="' + detailPage + '"><span>/ ' + totalPages + ' 页 (' + filtered.length + '条)</span>'
      + '<button id="detail-next"' + (detailPage >= totalPages ? ' disabled' : '') + '>下一页</button>'
      + '</div>';
  }

  $('#detail-table-container').innerHTML = html;

  if (currentDetailData && currentDetailData.ym) {
    const ym = currentDetailData.ym;
    for (const tr of $$('#detail-table tbody tr')) {
      if (currentType === 'guild') {
        const gid = tr.dataset.guildId;
        const gname = tr.dataset.guildName;
        if (!gid) continue;
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => openGuildPage(parseInt(gid), gname, ym));
      } else {
        const uid = tr.dataset.uid;
        const uname = tr.dataset.uname;
        if (!uid) continue;
        tr.style.cursor = 'pointer';
        tr.title = '点击查看所属公会';
        tr.addEventListener('click', async () => {
          try {
            const guilds = await fetchJSON(DATA_GUILD_MEMBERS + ym + '.json');
            if (!Array.isArray(guilds) || guilds.length === 0) {
              alert(uname + ' 未加入任何公会 (数据未生成)');
              return;
            }
            const found = guilds.find(g => g.users.some(u => String(u.uid) === uid));
            if (found) {
              openGuildPage(found.guildId, found.guildName, ym, parseInt(uid));
            } else {
              alert(uname + ' 未加入任何公会');
            }
          } catch (e) {
            alert('查询失败: ' + e.message);
          }
        });
      }
    }
  }

  const prevBtn = $('#detail-prev');
  const nextBtn = $('#detail-next');
  const pageInput = $('#detail-page-input');
  if (prevBtn) prevBtn.addEventListener('click', () => { detailPage--; renderDetailPage(); });
  if (nextBtn) nextBtn.addEventListener('click', () => { detailPage++; renderDetailPage(); });
  if (pageInput) {
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const n = parseInt(pageInput.value);
        if (n >= 1 && n <= totalPages) { detailPage = n; renderDetailPage(); }
      }
    });
  }
}

async function openGuildPage(guildId, guildName, ym, highlightUid) {
  $('#detail-section').style.display = 'none';
  $('#guild-section').style.display = 'block';
  $('#guild-title').textContent = guildName + ' · ' + fmtMonth(ym);
  $('#guild-desc').textContent = '加载中...';
  $('#guild-table-container').innerHTML = '';
  $('#guild-summary').innerHTML = '';
  $('#guild-search-input').value = '';

  try {
    const guilds = await fetchJSON(DATA_GUILD_MEMBERS + ym + '.json');
    if (!Array.isArray(guilds) || guilds.length === 0) {
      $('#guild-desc').textContent = '公会成员数据尚未生成，请等待每日同步';
      return;
    }

    const guild = guilds.find(g => g.guildId === guildId);
    if (!guild) {
      $('#guild-desc').textContent = '该公会暂无成员数据';
      return;
    }

    currentGuildData = {
      guildId, guildName, ym, guild,
      allUsers: guild.users.sort((a, b) => b.score - a.score),
      highlightUid: highlightUid || null,
    };
    guildPage = 1;

    if (highlightUid) {
      const idx = currentGuildData.allUsers.findIndex(u => u.uid === highlightUid);
      if (idx >= 0) guildPage = Math.floor(idx / PAGE_ROWS) + 1;
    }

    renderGuildPage();
  } catch (e) {
    $('#guild-desc').textContent = '加载失败: ' + e.message;
  }
}

function getFilteredGuildUsers() {
  if (!currentGuildData) return [];
  const q = ($('#guild-search-input').value || '').toLowerCase().trim();
  if (!q) return currentGuildData.allUsers;
  return currentGuildData.allUsers.filter(u => {
    return u.userName.toLowerCase().includes(q) || String(u.uid).includes(q);
  });
}

function renderGuildPage() {
  if (!currentGuildData) return;
  const { guild } = currentGuildData;
  const filtered = getFilteredGuildUsers();
  const totalPages = Math.ceil(filtered.length / PAGE_ROWS);
  if (guildPage > totalPages) guildPage = totalPages || 1;
  const start = (guildPage - 1) * PAGE_ROWS;
  const pageUsers = filtered.slice(start, start + PAGE_ROWS);

  $('#guild-summary').innerHTML =
    '<div class="summary-item">'
    + '<span class="summary-label">成员总数</span>'
    + '<span class="summary-value">' + guild.users.length + '</span>'
    + '</div>'
    + '<div class="summary-item">'
    + '<span class="summary-label">总击杀</span>'
    + '<span class="summary-value">' + guild.totalKill.toLocaleString() + '</span>'
    + '</div>'
    + '<div class="summary-item">'
    + '<span class="summary-label">均 KD</span>'
    + '<span class="summary-value">' + guild.avgKd + '</span>'
    + '</div>';

  let html = '<table class="detail-table"><thead><tr><th>#</th><th>用户</th><th>击杀</th><th>死亡</th><th>KD</th><th>积分</th></tr></thead><tbody>';

  if (pageUsers.length === 0) {
    html += '<tr><td colspan="6" style="text-align:center;opacity:0.5">无匹配结果</td></tr>';
  } else {
    for (let i = 0; i < pageUsers.length; i++) {
      const u = pageUsers[i];
      const highlight = currentGuildData.highlightUid === u.uid ? ' class="highlight-row"' : '';
      html += '<tr' + highlight + ' data-guild-uid="' + u.uid + '">'
        + '<td>' + (start + i + 1) + '</td>'
        + '<td>' + esc(u.userName) + '<span class="uid">UID:' + u.uid + '</span></td>'
        + '<td>' + u.kills.toLocaleString() + '</td>'
        + '<td>' + u.deaths.toLocaleString() + '</td>'
        + '<td>' + u.kd.toFixed(2) + '</td>'
        + '<td>' + u.score.toLocaleString() + '</td>'
        + '</tr>';
    }
  }

  html += '</tbody></table>';

  if (totalPages > 1) {
    html += '<div class="pager">'
      + '<button id="guild-prev"' + (guildPage <= 1 ? ' disabled' : '') + '>上一页</button>'
      + '<span>第</span><input id="guild-page-input" type="text" value="' + guildPage + '"><span>/ ' + totalPages + ' 页 (' + filtered.length + '条)</span>'
      + '<button id="guild-next"' + (guildPage >= totalPages ? ' disabled' : '') + '>下一页</button>'
      + '</div>';
  }

  $('#guild-table-container').innerHTML = html;
  $('#guild-desc').textContent = '';

  if (currentGuildData.highlightUid) {
    setTimeout(() => {
      const row = document.querySelector('#guild-table-container tr.highlight-row');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  const prevBtn = $('#guild-prev');
  const nextBtn = $('#guild-next');
  const pageInput = $('#guild-page-input');
  if (prevBtn) prevBtn.addEventListener('click', () => { guildPage--; renderGuildPage(); });
  if (nextBtn) nextBtn.addEventListener('click', () => { guildPage++; renderGuildPage(); });
  if (pageInput) {
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const n = parseInt(pageInput.value);
        if (n >= 1 && n <= totalPages) { guildPage = n; renderGuildPage(); }
      }
    });
  }
}

$('#guild-search-input').addEventListener('input', () => {
  guildPage = 1;
  renderGuildPage();
});

$('#guild-back-btn').addEventListener('click', (e) => {
  e.preventDefault();
  currentGuildData = null;
  $('#guild-section').style.display = 'none';
  $('#detail-section').style.display = 'block';
});

$('#search-input').addEventListener('input', () => {
  detailPage = 1;
  renderDetailPage();
});

async function showMonthDetail(ym) {
  $('#overview-section').style.display = 'none';
  $('#detail-section').style.display = 'block';
  $('#detail-title').textContent = fmtMonth(ym);
  $('#detail-table-container').innerHTML = '';
  $('#summary-bar').innerHTML = '';
  $('#search-input').value = '';
  currentDetailData = null;

  try {
    const endpoint = currentType === 'user' ? DATA_MONTH : DATA_GUILD_MONTH;
    const data = await fetchJSON(endpoint + ym + '.json');
    if (data && data.users) {
      renderDetail(ym, data);
    } else {
      $('#detail-desc').textContent = '暂无数据';
      $('#detail-desc').style.display = 'block';
    }
  } catch (e) {
    $('#detail-desc').textContent = '加载失败: ' + e.message;
    $('#detail-desc').style.display = 'block';
  }
}

$('#back-btn').addEventListener('click', (e) => {
  e.preventDefault();
  currentDetailData = null;
  currentGuildData = null;
  $('#detail-section').style.display = 'none';
  $('#guild-section').style.display = 'none';
  $('#overview-section').style.display = 'block';
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function init() {
  try {
    await loadOverview();
  } catch (e) {
    $('#error-msg').textContent = '加载数据失败: ' + e.message;
    $('#error-msg').style.display = 'block';
    $('#overview-desc').textContent = '';
  }
}

init();
</script>
</body>
</html>
